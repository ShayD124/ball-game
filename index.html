<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>The Ball Game</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="controls">
      <button class="undo-btn" onclick="onUndo()">Undo</button>
      <button class="redo-btn" onclick="onRedo()">Redo</button>
    </div>
    <h1>The Ball Game</h1>
    <div class="ball ball1" onclick="onBallClick(0, 400)">100</div>
    <div class="ball ball2" onclick="onBallClick(1, 250)">100</div>
    <div class="ball ball3" onclick="onSwapClick()">Swap</div>
    <div class="ball ball4" onclick="onShrinkClick()">Shrink</div>
    <div class="ball ball5" onclick="onBgClick()">BG</div>
    <div
      class="ball ball6"
      onclick="onResetClick()"
      onmouseenter="onResetEnter()"
      onmouseleave="onResetLeave()"
    >
      Reset
    </div>

    <script src="util.js"></script>
    <script src="main.js"></script>
  </body>
</html>
